name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python deps and run pytest
        shell: bash
        run: |
          set -e
          echo "Checking for Python project files..."
          if [ -f requirements.txt ]; then
            pip install --upgrade pip
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install --upgrade pip
            pip install .
          else
            pip install --upgrade pip pytest
          fi

          if [ -d tests ] || ls *_test.py 2>/dev/null | grep -q . || [ -f pytest.ini ]; then
            pytest -q
          else
            echo "No Python tests found, skipping pytest"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend deps and run frontend tests
        shell: bash
        run: |
          set -e
          echo "Looking for frontend package.json..."
          if [ -f package.json ]; then
            pkg=.
          elif [ -f frontend/package.json ]; then
            pkg=frontend
          else
            echo "No frontend package.json found, skipping frontend tests"
            exit 0
          fi
          cd "$pkg"
          npm ci --silent
          if npm test --silent; then
            echo "Frontend tests passed"
          else
            echo "Frontend tests failed"
            exit 1
          fi
